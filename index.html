<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kol Test | PS4 Kurulum</title>
  <link rel="canonical" href="https://blackkonsol.github.io/ds4test/">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; color: #f4f7ff; background: #0b1019; font: 18px Arial, sans-serif; }
    .card { width: 100%; max-width: 590px; margin: 0 auto; padding: 32px; border: 1px solid #273850; border-radius: 16px; background: #131d2b; text-align: center; }
    .tag { margin: 0 0 12px; color: #a1c7ff; font-size: 14px; font-weight: bold; letter-spacing: 2px; }
    h1 { margin: 0 0 18px; font-size: 36px; }
    p { line-height: 1.5; }
    .intro { color: #d6dfed; }
    button { width: 100%; margin: 14px 0 8px; padding: 18px 12px; border: 2px solid transparent; border-radius: 10px; background: #265bc9; color: #fff; font: bold 18px Arial, sans-serif; cursor: pointer; }
    button:focus { outline: 3px solid #c5deff; outline-offset: 3px; }
    .version { margin: 8px 0 0; color: #a1c7ff; font-size: 12px; }
    #status { min-height: 3em; margin: 14px 0 0; color: #d6dfed; }
    #status.error { color: #ffb9b9; }
    #status.success { color: #9fe3bc; }
  </style>
</head>
<body>
  <main class="card">
    <p class="tag">PLAYSTATION 4</p>
    <h1>Kol Test</h1>
    <p class="intro">Bu sayfayı PS4 tarayıcısından açın. GoldHEN ve Payloader Server açık olmalıdır.</p>
    <button id="install" type="button" autofocus>KOL TEST’İ KUR</button>
    <p id="status" role="status" aria-live="polite">Kol Test hazırlanıyor…</p>
    <p class="version">BLACK KONSOL • Kol Test Kurulum v2</p>
    <noscript>Kurulumu başlatmak için PS4 tarayıcısında JavaScript’i etkinleştirin.</noscript>
  </main>
  <script>
  (function () {
    var service = 'http://127.0.0.1:12822';
    var server = 'http://127.0.0.1:9090';
    var serviceName = 'koltest-installer-v1';
    var payloadUrl = 'koltest.bin?v=860a68048f392987';
    var button = document.getElementById('install');
    var status = document.getElementById('status');
    var phase = 'idle', sent = false, requested = false;
    function show(message, kind) { status.textContent = message; status.className = kind || ''; }
    function request(method, url, body, binary, timeout, done) {
      var xhr = new XMLHttpRequest(), finished = false;
      function finish(error, value, code) { if (finished) return; finished = true; done(error, value, code); }
      try {
        xhr.open(method, url, true); xhr.timeout = timeout;
        if (binary) xhr.responseType = 'arraybuffer';
        xhr.onload = function () { finish(null, binary ? xhr.response : xhr.responseText, xhr.status); };
        xhr.onerror = function () { finish('Bağlantı kurulamadı.'); };
        xhr.ontimeout = function () { finish('Yanıt zaman aşımına uğradı.'); };
        xhr.send(body);
      } catch (e) { finish('İstek başlatılamadı.'); }
    }
    function json(value) { try { return JSON.parse(value); } catch (e) { return null; } }
    function fail(message) { phase = 'idle'; requested = false; show(message, 'error'); }
    function health(done) {
      request('GET', service + '/health', null, false, 1500, function (error, value, code) {
        var data = !error && code === 200 && json(value);
        done(Boolean(data && data.status === 'ok' && data.service === serviceName), Boolean(data && data.status === 'ok'));
      });
    }
    function ready() {
      phase = 'ready';
      if (requested) install();
      else show('Kol Test hazır. Kuruluma başlamak için X tuşuna basın.');
    }
    function wait(attempts) {
      health(function (ok, occupied) {
        if (ok) ready();
        else if (occupied) fail('Kol Test bağlantı noktası başka bir servis tarafından kullanılıyor. PS4’ü yeniden başlatın.');
        else if (attempts > 1) setTimeout(function () { wait(attempts - 1); }, 500);
        else fail('Payload gönderildi ancak Kol Test servisi yanıt vermedi. PS4’ü yeniden başlatıp tekrar deneyin.');
      });
    }
    function load() {
      show('GoldHEN Payloader Server kontrol ediliyor…');
      request('POST', server + '/status', null, false, 3000, function (error, value, code) {
        var data = !error && code === 200 && json(value);
        if (!data || data.status !== 'ready') {
          fail('Payloader Server’e ulaşılamadı. GoldHEN ayarlarından Payloader Server’i açın. (' + (error || 'Hazır yanıtı alınamadı.') + ')'); return;
        }
        show('Kol Test payload’ı yükleniyor…');
        request('GET', payloadUrl, null, true, 15000, function (error, payload, code) {
          if (error || code !== 200 || !payload || payload.byteLength !== 7057 || new Uint8Array(payload)[0] !== 0xe9) {
            fail('koltest.bin okunamadı veya sürümü farklı. ZIP’teki index.html ve koltest.bin dosyalarını birlikte yükleyin.'); return;
          }
          health(function (ok, occupied) {
            if (ok) { ready(); return; }
            if (occupied) { fail('Kol Test bağlantı noktası kullanımda. PS4’ü yeniden başlatın.'); return; }
            if (sent) { fail('Payload zaten gönderildi. PS4’ü yeniden başlatıp tekrar deneyin.'); return; }
            sent = true;
            request('POST', server, payload, false, 4000, function () { wait(10); });
          });
        });
      });
    }
    function prepare() {
      if (location.protocol !== 'https:' || location.hostname !== 'blackkonsol.github.io') {
        fail('PS4 tarayıcısında https://blackkonsol.github.io/ds4test/ adresini açın.'); return;
      }
      if (!/PlayStation 4/i.test(navigator.userAgent)) { fail('Bu sayfayı PS4 tarayıcısından açın.'); return; }
      phase = 'preparing'; show('Kol Test servisi kontrol ediliyor…');
      health(function (ok, occupied) {
        if (ok) ready();
        else if (occupied) fail('Kol Test bağlantı noktası kullanımda. PS4’ü yeniden başlatın.');
        else if (sent) fail('Payload daha önce gönderildi. PS4’ü yeniden başlatıp tekrar deneyin.');
        else load();
      });
    }
    function install() {
      phase = 'installing'; requested = false; show('Kol Test indirme isteği PS4’e gönderiliyor…');
      request('POST', service + '/api/install', null, false, 120000, function (error, value, code) {
        var reply = json(value);
        if (error || !reply) {
          phase = 'submitted'; show('Sonuç doğrulanamadı. PS4 Bildirimler → İndirilenler bölümünü kontrol edin.', 'error'); return;
        }
        if (code === 200 && reply.status === 'success' && reply.stage === 'started' && typeof reply.task_id === 'number' && reply.task_id >= 0 && Math.floor(reply.task_id) === reply.task_id) {
          phase = 'submitted'; button.textContent = 'İNDİRME BAŞLADI';
          show('Kol Test indirme kuyruğuna eklendi. PS4 Bildirimler → İndirilenler bölümünden takip edebilirsiniz.', 'success'); return;
        }
        if (String(reply.error).toLowerCase() === '0x80990015' || (typeof reply.task_id === 'number' && reply.task_id >= 0)) {
          phase = 'submitted'; show('Kol Test görevi mevcut veya başlatılamadı. PS4 Bildirimler → İndirilenler bölümünü kontrol edin. ' + (reply.error || ''), 'error'); return;
        }
        if (code === 200 && reply.status === 'success') {
          phase = 'submitted'; show('İndirme yanıtı doğrulanamadı. PS4 Bildirimler → İndirilenler bölümünü kontrol edin.', 'error'); return;
        }
        phase = 'ready'; show('Kurulum başlatılamadı. ' + (reply.stage || '') + ' ' + (reply.error || ''), 'error');
      });
    }
    button.onclick = function () {
      if (phase === 'submitted' || phase === 'installing') return;
      if (phase === 'ready') { install(); return; }
      requested = true;
      if (phase === 'preparing') show('Kol Test hazırlanıyor. Lütfen bekleyin…');
      else prepare();
    };
    prepare();
  })();
  </script>
</body>
</html>
